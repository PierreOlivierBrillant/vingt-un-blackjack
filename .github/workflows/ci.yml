name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Firebase functions, rules, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.25.0

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.0 --no-fund --no-audit

      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Build functions (loaded by the Functions emulator)
        run: npm run build

      - name: Firestore rules tests
        working-directory: firebase
        run: firebase emulators:exec --project demo-blackjack --only firestore "npm --prefix functions run test:rules"

      - name: Emulator integration tests
        working-directory: firebase
        run: firebase emulators:exec --project demo-blackjack --only auth,firestore,functions "npm --prefix functions run test:integration"

  flutter:
    name: Flutter (analyze, tests, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      # Fonts are embedded in test/fonts (identical metrics on every OS).
      - run: flutter test --exclude-tags golden
      # Layout stress test: square test glyphs, much wider than Roboto.
      - name: Widget tests without the embedded fonts (no overflow allowed)
        run: flutter test test/widget
        env:
          VINGTUN_TEST_SYSTEM_FONTS: '1'
      # Goldens are generated on Windows; compared with a 0.3 % pixel tolerance.
      # Non-blocking until confirmed stable on Linux (failures uploaded below).
      - name: Golden tests
        id: goldens
        continue-on-error: true
        run: flutter test --tags golden
      - uses: actions/upload-artifact@v7
        if: steps.goldens.outcome == 'failure'
        with:
          name: golden-failures
          path: app/test/golden/failures/
          retention-days: 7
      # BACKEND_HOST left at its default (10.0.2.2); it can be changed on the "Serveur" screen.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: vingt-un-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
